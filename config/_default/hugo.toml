# 本地预览。GitHub Actions 构建时会按 Pages 地址覆盖 baseURL。
baseURL = "http://localhost:1313/"
title = "技术笔记"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
summaryLength = 80
pluralizeListTitles = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS"]

[module]
  [[module.imports]]
    path = "github.com/mnordhaus/pico-base"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
